name: Daily regression

on:
  schedule:
    # Every day at 06:00 UTC. Cron uses UTC. Adjust to suit your timezone.
    - cron: '0 6 * * *'
  # Also allow running it on demand from the Actions tab.
  workflow_dispatch:
    inputs:
      suites:
        description: Which suites to run
        type: choice
        default: '["api","ui"]'
        options:
          - '["api","ui"]'
          - '["api"]'
          - '["ui"]'

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml
    with:
      suites: ${{ inputs.suites || '["api","ui"]' }}
    secrets: inherit
